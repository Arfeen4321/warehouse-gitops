apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warehouse-api-ingress
  namespace: warehouse-dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "3.87.142.47"
        - warehouse-api.local
      secretName: warehouse-api-tls-secret
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warehouse-api-service
                port:
                  number: 8000
